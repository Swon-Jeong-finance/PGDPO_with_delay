[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgdpo-delay"
version = "0.1.0"
description = "PGDPO delay-control benchmarks: reference layer, solver, experiments"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pyyaml"]

[project.scripts]
pgdpo-delay = "pgdpo_delay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgdpo_delay = ["configs/p1/*.yaml", "configs/p2/*.yaml", "configs/p3/*.yaml", "configs/p4/*.yaml"]
