# P1-U(main_u) frozen calibration -- SAME V3 problem/grid numbers as
# main.yaml with the box removed (Stage-I review H1: the exact Riccati
# oracle's actions leave the box ~39%% of the time, so P1-U must NOT
# train through a box chart). (V3, reviewer-approved 2026-08-06).
# SINGLE SOURCE for paper numbers: code carries no fallback defaults.
problem:
  a: -0.3
  a_delay: 0.9
  b: 1.0
  sigma0: 0.2
  c_x: 0.1
  c_y: 0.30
  gamma_u: 0.7
  Q: 1.0
  R: 0.1
  Q_T: 2.0
grid:
  T: 1.0
  delta: 0.2
  taps: 16            # dt = delta / taps = 0.0125
tracking:
  ref_amplitude: 0.5
  x_target: 0.3
control:
  kind: unconstrained
budgets:
  M: 8192
  M_out: 512
  M_in: 8
